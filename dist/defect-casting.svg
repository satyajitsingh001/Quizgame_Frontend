<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#metalBg)"/>
  
  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">METALLURGICAL CASTING CROSS-SECTION #CS-88</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#94a3b8">NDT Radiographic &amp; Metallographic Examination | Foundry Batch 2026</text>

  <!-- Zone 1: Shrinkage Cavity -->
  <g transform="translate(80, 140)">
    <rect width="280" height="130" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <path d="M 60 40 Q 140 20 220 50 Q 200 110 120 100 Q 50 90 60 40 Z" fill="#475569" stroke="#64748b"/>
    <!-- Jagged internal shrinkage void -->
    <path d="M 120 55 L 145 60 L 160 50 L 155 75 L 175 80 L 150 90 L 130 80 L 125 90 L 115 70 Z" fill="#020617" stroke="#dc2626"/>
    <circle cx="25" cy="25" r="16" fill="#ef4444"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">ZONE #1</text>
  </g>

  <!-- Zone 2: Gas Blowholes -->
  <g transform="translate(440, 140)">
    <rect width="280" height="130" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <rect x="50" y="35" width="180" height="75" rx="6" fill="#475569"/>
    <!-- Smooth rounded gas porosity voids -->
    <circle cx="90" cy="65" r="14" fill="#020617" stroke="#f59e0b"/>
    <circle cx="130" cy="55" r="10" fill="#020617" stroke="#f59e0b"/>
    <circle cx="165" cy="75" r="12" fill="#020617" stroke="#f59e0b"/>
    <circle cx="195" cy="60" r="8" fill="#020617" stroke="#f59e0b"/>
    <circle cx="25" cy="25" r="16" fill="#f59e0b"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde68a">ZONE #2</text>
  </g>

  <!-- Zone 3: Cold Shut -->
  <g transform="translate(80, 310)">
    <rect width="280" height="130" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <!-- Two converging molten streams with unbonded oxide interface -->
    <path d="M 50 35 L 140 35 L 135 110 L 50 110 Z" fill="#475569"/>
    <path d="M 145 35 L 230 35 L 230 110 L 140 110 Z" fill="#64748b"/>
    <line x1="138" y1="35" x2="137" y2="110" stroke="#38bdf8" stroke-width="4" stroke-dasharray="3"/>
    <circle cx="25" cy="25" r="16" fill="#3b82f6"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">ZONE #3</text>
  </g>

  <!-- Zone 4: Slag Inclusion -->
  <g transform="translate(440, 310)">
    <rect width="280" height="130" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
    <rect x="50" y="35" width="180" height="75" rx="6" fill="#475569"/>
    <!-- Irregular dark non-metallic entrapment -->
    <path d="M 100 50 Q 140 45 150 70 Q 120 85 90 70 Z" fill="#78350f" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="25" cy="25" r="16" fill="#a855f7"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d8b4fe">ZONE #4</text>
  </g>
</svg>
