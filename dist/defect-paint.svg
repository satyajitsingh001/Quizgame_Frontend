<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#carBody)"/>
  
  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0e7ff">AUTOMOTIVE COATING INSPECTION #PT-901</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#a5b4fc">Paint Booth Quality Audit | Clearcoat &amp; Basecoat Analysis</text>

  <!-- Zone 1: Orange Peel -->
  <g transform="translate(80, 140)">
    <rect width="280" height="130" rx="8" fill="#020617" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="35" width="200" height="75" rx="6" fill="#312e81"/>
    <!-- Textured bumpy surface resembling citrus skin -->
    <path d="M 45 70 Q 60 60 75 70 T 105 70 T 135 70 T 165 70 T 195 70 T 225 70" fill="none" stroke="#818cf8" stroke-width="3"/>
    <path d="M 45 85 Q 60 75 75 85 T 105 85 T 135 85 T 165 85 T 195 85 T 225 85" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="25" cy="25" r="16" fill="#ef4444"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">ZONE #1</text>
  </g>

  <!-- Zone 2: Paint Sagging (Curtains/Runs) -->
  <g transform="translate(440, 140)">
    <rect width="280" height="130" rx="8" fill="#020617" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="35" width="200" height="75" rx="6" fill="#312e81"/>
    <!-- Excessive paint downward drip/curtain -->
    <path d="M 70 40 L 70 75 Q 70 95 85 95 Q 100 95 100 75 L 100 40" fill="#a5b4fc"/>
    <path d="M 140 40 L 140 85 Q 140 100 155 100 Q 170 100 170 85 L 170 40" fill="#a5b4fc"/>
    <circle cx="25" cy="25" r="16" fill="#f59e0b"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde68a">ZONE #2</text>
  </g>

  <!-- Zone 3: Blistering -->
  <g transform="translate(80, 310)">
    <rect width="280" height="130" rx="8" fill="#020617" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="35" width="200" height="75" rx="6" fill="#312e81"/>
    <!-- Trapped moisture / solvent bubbles -->
    <circle cx="90" cy="70" r="14" fill="#4338ca" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="140" cy="65" r="18" fill="#4338ca" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="185" cy="75" r="12" fill="#4338ca" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="25" cy="25" r="16" fill="#3b82f6"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">ZONE #3</text>
  </g>

  <!-- Zone 4: Fish Eyes (Silicone Contamination) -->
  <g transform="translate(440, 310)">
    <rect width="280" height="130" rx="8" fill="#020617" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="35" width="200" height="75" rx="6" fill="#312e81"/>
    <!-- Circular craters with dot in center -->
    <circle cx="90" cy="70" r="16" fill="none" stroke="#c084fc" stroke-width="3"/>
    <circle cx="90" cy="70" r="4" fill="#f8fafc"/>
    <circle cx="160" cy="70" r="20" fill="none" stroke="#c084fc" stroke-width="3"/>
    <circle cx="160" cy="70" r="5" fill="#f8fafc"/>
    <circle cx="25" cy="25" r="16" fill="#a855f7"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d8b4fe">ZONE #4</text>
  </g>
</svg>
