<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="machBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#machBg)"/>
  
  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">CNC PRECISION MACHINED COMPONENT #CNC-55</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#94a3b8">Coordinate Measuring Machine (CMM) &amp; Surface Roughness Metrology</text>

  <!-- Zone 1: Burr Formation -->
  <g transform="translate(80, 140)">
    <rect width="280" height="130" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <rect x="50" y="45" width="160" height="55" fill="#475569"/>
    <!-- Rough sharp jagged ridge hanging on machined corner -->
    <path d="M 210 45 L 215 42 L 212 50 L 220 48 L 213 58 L 218 65 L 210 70 Z" fill="#ef4444" stroke="#f87171"/>
    <circle cx="25" cy="25" r="16" fill="#ef4444"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">ZONE #1</text>
  </g>

  <!-- Zone 2: Chatter Marks -->
  <g transform="translate(440, 140)">
    <rect width="280" height="130" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="40" width="200" height="60" fill="#475569"/>
    <!-- Periodic wave-like vibration lines across face -->
    <path d="M 60 40 L 70 100 M 80 40 L 90 100 M 100 40 L 110 100 M 120 40 L 130 100 M 140 40 L 150 100 M 160 40 L 170 100 M 180 40 L 190 100" stroke="#fde047" stroke-width="3" stroke-dasharray="6"/>
    <circle cx="25" cy="25" r="16" fill="#f59e0b"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde68a">ZONE #2</text>
  </g>

  <!-- Zone 3: Dimensional Distortion -->
  <g transform="translate(80, 310)">
    <rect width="280" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <!-- Intended rectangle outline vs warped bowed reality -->
    <rect x="50" y="50" width="170" height="40" fill="none" stroke="#64748b" stroke-dasharray="4"/>
    <path d="M 50 50 Q 135 25 220 50 L 220 90 Q 135 115 50 90 Z" fill="#3b82f6" opacity="0.6"/>
    <circle cx="25" cy="25" r="16" fill="#3b82f6"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">ZONE #3</text>
  </g>

  <!-- Zone 4: Tool Scratches -->
  <g transform="translate(440, 310)">
    <rect width="280" height="130" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
    <rect x="40" y="40" width="200" height="60" fill="#475569"/>
    <!-- Deep irregular gouges / tool drag scratches across mirror face -->
    <path d="M 55 45 Q 120 85 220 60 M 70 85 Q 150 45 205 90" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="25" cy="25" r="16" fill="#a855f7"/>
    <text x="25" y="31" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d8b4fe">ZONE #4</text>
  </g>
</svg>
