<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#047857" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- PCB Base Board -->
  <rect width="800" height="500" rx="12" fill="url(#pcbBg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Traces -->
  <path d="M 50 120 L 250 120 L 250 200 L 400 200" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>
  <path d="M 80 400 L 300 400 L 350 320 L 550 320" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>
  <path d="M 450 100 L 650 100 L 700 250" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>

  <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6ee7b7">INSPECTION BOARD #A-402 : SMT ASSEMBLY</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#a7f3d0">Optical Inspection Magnification: 25X | Batch Q-2026</text>

  <!-- DEFECT ZONE 1: Solder Bridging (Top-Left) -->
  <g transform="translate(100, 150)">
    <rect width="200" height="120" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
    <!-- IC Pins -->
    <rect x="30" y="40" width="15" height="40" fill="#94a3b8" rx="2"/>
    <rect x="60" y="40" width="15" height="40" fill="#94a3b8" rx="2"/>
    <rect x="90" y="40" width="15" height="40" fill="#94a3b8" rx="2"/>
    <rect x="120" y="40" width="15" height="40" fill="#94a3b8" rx="2"/>
    <!-- Unintended Solder Bridge between pins 2 & 3 -->
    <ellipse cx="82" cy="60" rx="18" ry="12" fill="#cbd5e1"/>
    <!-- Defect Marker 1 -->
    <circle cx="20" cy="20" r="16" fill="#ef4444"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="50" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">ZONE #1</text>
  </g>

  <!-- DEFECT ZONE 2: Cold Solder Joint (Top-Right) -->
  <g transform="translate(480, 150)">
    <rect width="220" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="110" cy="65" r="30" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <!-- Dull, grainy, cracked solder mound -->
    <circle cx="110" cy="65" r="22" fill="#64748b" stroke="#475569" stroke-width="2"/>
    <path d="M 100 55 L 120 75 M 105 75 L 115 55" stroke="#1e293b" stroke-width="2"/>
    <!-- Defect Marker 2 -->
    <circle cx="20" cy="20" r="16" fill="#f59e0b"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="50" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fde68a">ZONE #2</text>
  </g>

  <!-- DEFECT ZONE 3: Tombstoning (Bottom-Left) -->
  <g transform="translate(100, 310)">
    <rect width="200" height="130" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <!-- Copper pads -->
    <rect x="40" y="80" width="30" height="15" fill="#f59e0b"/>
    <rect x="130" y="80" width="30" height="15" fill="#f59e0b"/>
    <!-- Chip capacitor standing on end (tombstone) -->
    <rect x="45" y="30" width="20" height="50" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <!-- Solder fillet on lifted pad -->
    <path d="M 40 80 Q 55 70 55 80 Z" fill="#94a3b8"/>
    <!-- Defect Marker 3 -->
    <circle cx="20" cy="20" r="16" fill="#3b82f6"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="50" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">ZONE #3</text>
  </g>

  <!-- DEFECT ZONE 4: Missing Component (Bottom-Right) -->
  <g transform="translate(480, 310)">
    <rect width="220" height="130" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
    <!-- Bare pads with flux paste but no SMD IC -->
    <rect x="70" y="55" width="25" height="35" fill="#ca8a04" stroke="#eab308" stroke-dasharray="2"/>
    <rect x="125" y="55" width="25" height="35" fill="#ca8a04" stroke="#eab308" stroke-dasharray="2"/>
    <text x="110" y="105" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">[VACANT PAD C14]</text>
    <!-- Defect Marker 4 -->
    <circle cx="20" cy="20" r="16" fill="#a855f7"/>
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="50" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d8b4fe">ZONE #4</text>
  </g>
</svg>
